<!DOCTYPE html>
<html>
    <head>
    <title>Registration</title>

    <link rel="stylesheet" href="styles.css">

    </head>
<body>
    <div id="Registration">
    <h1>Registration</h1>
        <h3> Please fill in all the details required</h3>
    <form action="Submit-Registration.html" method="post">
        <label><b>Full Name:</b></label>
        <input type="text" id="full_name" name="full_name" required placeholder="Enter your full name"><br><br>

        <label><b>Student ID:</b></label>
        <input type="text" id="student_id" name="student_id" required placeholder="TPXXXXXX"><br><br>
        
        <label for="Phone Contact"><b>Phone/Contact Number</b></label>
        <input type="tel" id="phone_contact" name="phone_contact" required placeholder="(+XXX) XX XXXX-XXXX"><br><br>

        <label><b>Date of Birth</b></label>
        <input type="date" id="Date" name="Date of Birth" required><br><br>

        <input type="submit" value="Register">  
        <input type="reset" value="Clear">
    
    </form>
    </div>


    
    </body>










</html>
